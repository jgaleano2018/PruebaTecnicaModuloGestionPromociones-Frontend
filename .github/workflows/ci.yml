smoke-test:
  name: Integration smoke test
  needs: build
  runs-on: ubuntu-latest

  env:
    VITE_API_URL: http://localhost:3000
    SMOKE_URL: http://localhost:3000
    DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  steps:
    - name: Checkout frontend
      uses: actions/checkout@v4

    - name: Checkout backend
      uses: actions/checkout@v4
      with:
        repository: jgaleano2018/PruebaTecnicaModuloGestionPromociones-Backend
        path: backend

    - name: Validate configuration
      shell: bash
      run: |
        set -Eeuo pipefail

        if [[ -z "${DB_PASSWORD:-}" ]]; then
          echo "DB_PASSWORD secret is missing" >&2
          exit 1
        fi

        if [[ ! -d "backend" ]]; then
          echo "Backend directory does not exist" >&2
          exit 1
        fi

        if [[ ! -f "backend/Dockerfile" ]]; then
          echo "Backend Dockerfile does not exist" >&2
          exit 1
        fi

    - name: Clean previous containers
      run: |
        docker compose \
          -f docker-compose.yml \
          -f docker-compose.ci.yml \
          down -v --remove-orphans

    - name: Start application
      run: |
        docker compose \
          -f docker-compose.yml \
          -f docker-compose.ci.yml \
          up -d --build

    - name: Show container status
      run: |
        docker compose \
          -f docker-compose.yml \
          -f docker-compose.ci.yml \
          ps

    - name: Wait for backend health endpoint
      shell: bash
      run: |
        set -Eeuo pipefail

        for attempt in {1..60}; do

          status=$(curl -sS \
            -o /tmp/health-response \
            -w '%{http_code}' \
            "$SMOKE_URL/health" || true)

          if [[ "$status" == "200" ]]; then
            echo "Health check passed"
            cat /tmp/health-response
            exit 0
          fi

          echo "Waiting for /health (attempt $attempt/60, status: ${status:-connection-failed})"

          sleep 2
        done

        echo "Smoke test failed" >&2

        docker compose \
          -f docker-compose.yml \
          -f docker-compose.ci.yml \
          ps

        docker compose \
          -f docker-compose.yml \
          -f docker-compose.ci.yml \
          logs

        exit 1

    - name: Stop application
      if: always()
      run: |
        docker compose \
          -f docker-compose.yml \
          -f docker-compose.ci.yml \
          down -v --remove-orphans