name: CI

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  # ============================================================
  # 2. TEST
  # ============================================================
  test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage


  # ============================================================
  # 3. BUILD
  # ============================================================
  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:3000
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: jgaleano2018/PruebaTecnicaModuloGestionPromociones-Backend
          path: backend

      - name: Validate CI configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${VITE_API_URL:-}" ]]; then
            echo "Missing required CI variable: VITE_API_URL" >&2
            exit 1
          fi

          if [[ -z "${DB_PASSWORD:-}" ]]; then
            echo "Missing required CI secret: DB_PASSWORD" >&2
            exit 1
          fi

          if [[ ! -d "backend" ]]; then
            echo "Backend directory does not exist" >&2
            exit 1
          fi

          if [[ ! -f "backend/Dockerfile" ]]; then
            echo "Backend Dockerfile does not exist" >&2
            exit 1
          fi

          echo "Frontend y backend encontrados correctamente."

      - name: Build backend and frontend images
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            build


  # ============================================================
  # 4. SMOKE TEST
  # ============================================================
  smoke-test:
    name: Integration smoke test
    needs: build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:3000
      SMOKE_URL: http://localhost:3000
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: jgaleano2018/PruebaTecnicaModuloGestionPromociones-Backend
          path: backend

      - name: Validate smoke-test configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          required=(VITE_API_URL SMOKE_URL DB_PASSWORD)

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required CI configuration: ${name}" >&2
              exit 1
            fi
          done

          if [[ ! -d "backend" ]]; then
            echo "Backend directory does not exist" >&2
            exit 1
          fi

          if [[ ! -f "backend/Dockerfile" ]]; then
            echo "Backend Dockerfile does not exist" >&2
            exit 1
          fi

      - name: Start application
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            up -d --build

      - name: Show container status
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            ps

      - name: Wait for backend health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in {1..30}; do

            status=$(curl -sS \
              -o /tmp/health-response \
              -w '%{http_code}' \
              "$SMOKE_URL/health" || true)

            if [[ "$status" == "200" ]]; then
              echo "Health check passed"
              cat /tmp/health-response
              exit 0
            fi

            echo "Waiting for /health (attempt $attempt/30, status: ${status:-connection-failed})"

            sleep 2
          done

          echo "Smoke test failed: $SMOKE_URL/health did not return HTTP 200" >&2

          echo "========== DOCKER PS =========="
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            ps

          echo "========== DOCKER LOGS =========="
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            logs

          exit 1

      - name: Stop application
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            down -v