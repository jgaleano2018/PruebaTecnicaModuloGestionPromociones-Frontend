services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S tcp:127.0.0.1,1433 -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -N o -l 3 -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s


  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      DB_PASSWORD: "${DB_PASSWORD}"

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        echo "Esperando SQL Server..."

        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$${DB_PASSWORD}" \
          -C \
          -Q "IF DB_ID('PromocionesDB') IS NULL CREATE DATABASE PromocionesDB"

        echo "PromocionesDB creada/verificada correctamente."

        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$${DB_PASSWORD}" \
          -C \
          -Q "SELECT name, state_desc FROM sys.databases WHERE name = 'PromocionesDB'"

        echo "Inicialización de SQL Server completada."


  backend:
    build:
      context: ../PruebaTecnicaModuloGestionPromociones-Backend
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production

      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: PromocionesDB

      DB_USE_WINDOWS_AUTH: "false"
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "true"

    ports:
      - "3000:3000"

    depends_on:
      sqlserver-init:
        condition: service_completed_successfully


  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3000}"

    ports:
      - "3001:80"

    depends_on:
      backend:
        condition: service_started