services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: secrets.DB_PASSWORD
    ports:
      - "1433:1433"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    depends_on:
      - sqlserver

    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: secrets.DB_PASSWORD

    ports:
      - "3000:3000"

  frontend:
    depends_on:
      - backend

    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}

    ports:
      - "8080:80"